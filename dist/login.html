<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>
    Project Hub — Login
  </title>

  <link
    rel="stylesheet"
    href="./css/app.css"
  >

</head>

<body class="login-page">

  <main class="login-shell">

    <section class="login-card">

      <div class="brand-mark">
        KH
      </div>

      <p class="eyebrow">
        COMMAND CENTRE
      </p>

      <h1>
        Welcome back.
      </h1>

      <p class="muted">
        Projects. Content. Everything.
      </p>

      <form
        id="login-form"
        class="login-form"
      >

        <label id="display-name-label" hidden>
          Display name
          <input id="display-name" name="displayName" autocomplete="name" maxlength="100">
        </label>
        <label>
          Username

          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
            maxlength="100"
          >
        </label>

        <label>
          Password

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            maxlength="500"
          >
        </label>

        <p
          role="alert"
          id="login-error"
          class="error-message"
          hidden
        ></p>

        <button
          id="login-button"
          class="primary-button"
          type="submit"
        >
          Enter Command Centre
        </button>

      </form>
      <button id="account-mode" class="ghost-button" type="button">Create an account</button>

    </section>

  </main>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>

  <script src="./js/login.js"></script>
</body>
</html>
