<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>
    Project Hub
  </title>

  <link
    rel="stylesheet"
    href="./css/app.css"
  >

</head>

<body>

<div class="app-shell">

  <aside class="sidebar">

    <div class="sidebar-brand">

      <div class="brand-mark">
        KH
      </div>

      <div>
        <strong>PROJECT HUB</strong>
        <small>Command Centre</small>
      </div>

    </div>

    <nav class="navigation">

      <button
        class="nav-item active"
        data-view="today"
      >
        Today
      </button>

      <button
        class="nav-item"
        data-view="create"
      >
        + Create
      </button>

      <button
        class="nav-item"
        data-view="calendar"
      >
        Calendar
      </button>

      <button
        class="nav-item"
        data-view="content"
      >
        Content
      </button>

      <button
        class="nav-item"
        data-view="projects"
      >
        Projects
      </button>

      <button
        class="nav-item"
        data-view="ideas"
      >
        Ideas
      </button>

      <button
        class="nav-item"
        data-view="analytics"
      >
        Analytics
      </button>

      <button
        class="nav-item"
        data-view="accounts"
      >
        Accounts
      </button>

    </nav>

    <div class="sidebar-footer">

      <button
        id="logout-button"
        class="nav-item"
      >
        Sign out
      </button>

    </div>

  </aside>


  <main class="main-content">

    <header class="topbar">

      <div>

        <p class="eyebrow">
          COMMAND CENTRE
        </p>

        <h1 id="welcome-heading">
          Loading...
        </h1>

      </div>

      <button
        id="quick-create"
        class="primary-button"
      >
        + Create Content
      </button>

    </header>


    <section
      id="dashboard"
      class="dashboard-grid"
    >

      <article class="panel hero-panel">

        <div>

          <p class="eyebrow">
            TODAY
          </p>

          <h2>
            What are we shipping?
          </h2>

          <p class="muted">
            Everything that needs your
            attention, in one place.
          </p>

        </div>

      </article>


      <article class="panel">

        <div class="panel-header">

          <div>

            <p class="eyebrow">
              CONTENT
            </p>

            <h2>
              Publishing Queue
            </h2>

          </div>

        </div>

        <div id="publication-list">
          Loading...
        </div>

      </article>


      <article class="panel">

        <div class="panel-header">

          <div>

            <p class="eyebrow">
              WORK
            </p>

            <h2>
              Tasks
            </h2>

          </div>

        </div>

        <div id="task-list">
          Loading...
        </div>

      </article>


      <article class="panel">

        <div class="panel-header">

          <div>

            <p class="eyebrow">
              PROJECTS
            </p>

            <h2>
              Active Projects
            </h2>

          </div>

          <button
            id="new-project-button"
            class="secondary-button"
          >
            + Project
          </button>

        </div>

        <div
          id="project-grid"
          class="project-grid"
        >
          Loading...
        </div>

      </article>

    </section>

  </main>

</div>


<dialog id="project-dialog">

  <form
    id="project-form"
    class="dialog-form"
  >

    <div class="dialog-heading">

      <div>

        <p class="eyebrow">
          NEW
        </p>

        <h2>
          Create Project
        </h2>

      </div>

      <button
        id="close-project-dialog"
        type="button"
        class="icon-button"
      >
        ×
      </button>

    </div>

    <label>
      Name

      <input
        id="project-name"
        required
        maxlength="100"
      >
    </label>

    <label>
      Type

      <select id="project-type">

        <option value="content">
          Content / Creator
        </option>

        <option value="software">
          Software
        </option>

        <option value="game">
          Game Development
        </option>

        <option value="brand">
          Brand
        </option>

        <option value="saas">
          Website / SaaS
        </option>

        <option value="custom">
          Custom
        </option>

      </select>

    </label>

    <label>
      Description

      <textarea
        id="project-description"
        maxlength="2000"
      ></textarea>
    </label>

    <label>
      Accent

      <input
        id="project-colour"
        type="color"
        value="#8b5cf6"
      >
    </label>

    <button
      class="primary-button"
      type="submit"
    >
      Create Project
    </button>

  </form>

</dialog>


<script src="./js/config.js"></script>
<script src="./js/api.js"></script>
<script src="./js/app.js"></script>

</body>

</html>
